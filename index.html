<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="Wochenplanung nach Stephen Coveys Habit 3" />
    <title>Weekly Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Gegenstück zu public/404.html: ursprünglich angefragte Route wiederherstellen.
      (function () {
        var target = sessionStorage.getItem('spa-redirect')
        if (!target) return
        sessionStorage.removeItem('spa-redirect')
        history.replaceState(null, '', document.baseURI.replace(/\/$/, '') + target)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
